[workspace]
resolver = "3"
members = [
  "crates/sony",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive", "env", "string"] }
ddd = { git = "https://github.com/clemenscodes/ddd", tag = "v0.3.0" }
aes = "=0.9.3"
cbc = "=0.2.1"
cmac = "=0.8.0"
ctr = "=0.10.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }
md-5 = "=0.11.0"
sha1 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_test = "=1.0.177"
bytes = { git = "https://github.com/clemenscodes/bytes", tag = "v0.0.2" }
